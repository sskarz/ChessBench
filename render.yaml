services:
  # --- Backend (FastAPI + Stockfish) ---
  - type: web
    name: chessbench-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: STOCKFISH_PATH
        value: /usr/local/bin/stockfish
      - key: DATABASE_URL
        value: sqlite:////app/data/arena.db
      - key: ANALYSIS_DEPTH
        value: "12"
      - key: STOCKFISH_THREADS
        value: "1"
      - key: STOCKFISH_HASH_MB
        value: "64"
      - key: MOVE_DELAY_SECONDS
        value: "1.5"
      - key: LLM_MAX_RETRIES
        value: "5"
      - key: LLM_TEMPERATURE
        value: "0.0"
      - key: LLM_MAX_TOKENS
        value: "128"
      - key: LLM_REASONING_EFFORT
        value: none
      - key: OPENROUTER_API_KEY
        sync: false # set manually in Render dashboard

  # --- Frontend (Next.js) ---
  - type: web
    name: chessbench-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    # Pass the backend URL at Docker build time so Next.js bakes it into
    # the client-side bundle. Change this if your backend gets a different URL.
    docker:
      buildArgs:
        NEXT_PUBLIC_API_URL: https://chessbench-backend.onrender.com
        BACKEND_URL: https://chessbench-backend.onrender.com
