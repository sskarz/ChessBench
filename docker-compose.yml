services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    volumes:
      - chessbench-data:/app/data
    environment:
      - STOCKFISH_PATH=/usr/local/bin/stockfish
      - DATABASE_URL=sqlite:////app/data/arena.db

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  chessbench-data:
