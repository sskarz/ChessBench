services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - chessbench-data:/app/data
    environment:
      - STOCKFISH_PATH=/usr/local/bin/stockfish
      - DATABASE_URL=sqlite:////app/data/arena.db

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=https://chessbench.net
      - NEXT_PUBLIC_WS_URL=wss://chessbench.net/ws/live
    depends_on:
      - backend

volumes:
  chessbench-data:
  caddy-data:
  caddy-config:
